[workspace]
resolver = "2"
members = [
    "crates/server",
]
default-members = [
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = ""

[workspace.dependencies]
# Async runtime
tokio = { version = "1.51", features = ["full"] }
tower-sessions = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"



# Environment variables
dotenvy = "0.15"


# Web framework (Axum)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database (SQLx)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "mysql", "migrate", "tls-rustls", "time", "uuid"] }






[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
